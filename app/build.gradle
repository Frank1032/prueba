plugins {
    id 'com.android.application'
}

android {
    namespace 'co.edu.udea.animales'
    compileSdk 34

    defaultConfig {
        applicationId 'co.edu.udea.animales'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // El motor que corre la red dentro del celular (TensorFlow Lite)
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
}
