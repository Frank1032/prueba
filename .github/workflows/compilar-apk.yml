name: Compilar la app (APK)

on:
  push:
    branches: [app-animales]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Dar nombre al archivo
        run: cp app/build/outputs/apk/debug/app-debug.apk AnimalesEfficientNet.apk

      - name: Guardar el APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: AnimalesEfficientNet
          path: AnimalesEfficientNet.apk

      - name: Publicar el APK para descargarlo desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: App Animales EfficientNet (versión ${{ github.run_number }})
          body: Descargue AnimalesEfficientNet.apk desde el celular Android e instálelo.
          files: AnimalesEfficientNet.apk
          make_latest: true
